# Temporary read-only research workflow. Remove after the trace.
name: Temporary Polymarket withdrawal trace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reconstruct stablecoin outflows and bridge destinations
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          wallets={'main':'0x565ca59275f81991bd9877d7fa8404c5ecf6519e','alt1':'0x75973c667cec880353450be3a6f17c5da67b4421','alt2':'0xa01c0a5e4f8c1114e95c68ee97694bc95e51766c'}
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'pm-trace-fix/1.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=45) as r: return json.loads(r.read())
          result={}
          for label,w in wallets.items():
            rows=[]
            for offset in range(0,30000,500):
              page=get(f'https://data-api.polymarket.com/activity?user={w}&limit=500&offset={offset}')
              rows.extend(page)
              if len(page)<500: break
            result[label]={'activity_count':len(rows),'withdrawals':[x for x in rows if str(x.get('type','')).upper()=='WITHDRAWAL']}
          open('polymarket-withdrawal-summary-fixed.json','w').write(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: polymarket-withdrawal-trace-fixed
          path: polymarket-withdrawal-summary-fixed.json
          retention-days: 3
