name: Temporary Polymarket withdrawal resolver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pm-withdrawal-resolver.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve withdrawal transactions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          W={
            'main':'0x565ca59275f81991bd9877d7fa8404c5ecf6519e',
            'alt1':'0x75973c667cec880353450be3a6f17c5da67b4421',
            'alt2':'0xa01c0a5e4f8c1114e95c68ee97694bc95e51766c'}
          PM='https://data-api.polymarket.com/activity'
          BS='https://polygon.blockscout.com/api/v2'
          BR='https://bridge.polymarket.com/status/'
          RELAY='https://api.relay.link/requests/v2'

          def get(url,params=None,attempts=5):
            if params: url += ('&' if '?' in url else '?')+urllib.parse.urlencode(params)
            last=None
            for i in range(attempts):
              try:
                q=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'pm-resolver/1.0'})
                with urllib.request.urlopen(q,timeout=45) as r:
                  return {'ok':True,'status':r.status,'url':r.url,'data':json.loads(r.read())}
              except Exception as e:
                last={'ok':False,'url':url,'error':f'{type(e).__name__}: {e}'}; time.sleep(i+1)
            return last

          def activity(addr):
            rows=[]; errs=[]
            for off in range(0,50000,500):
              r=get(PM,{'user':addr,'limit':500,'offset':off})
              d=r.get('data') if isinstance(r,dict) else None
              if not isinstance(d,list): errs.append(r); break
              rows.extend(d)
              if len(d)<500: break
            return rows,errs

          def tx_transfers(h):
            items=[]; params={}
            for _ in range(20):
              r=get(f'{BS}/transactions/{h}/token-transfers',params)
              d=r.get('data') if isinstance(r,dict) else None
              if not isinstance(d,dict): return {'items':items,'error':r}
              items += d.get('items') or []
              params=d.get('next_page_params') or {}
              if not params: break
            return {'items':items}

          out={'generated_at':int(time.time()),'wallets':{},'shared':{}}
          destsets={}
          for label,addr in W.items():
            rows,errs=activity(addr)
            types={}
            for x in rows: types[str(x.get('type') or '')]=types.get(str(x.get('type') or ''),0)+1
            withdrawals=[x for x in rows if str(x.get('type') or '').upper()=='WITHDRAWAL']
            resolved=[]; ds=set()
            for x in withdrawals:
              h=str(x.get('transactionHash') or '').lower()
              if not h: continue
              detail=get(f'{BS}/transactions/{h}')
              transfers=tx_transfers(h)
              relay=get(RELAY,{'hash':h,'limit':50})
              candidates=set()
              for t in transfers.get('items',[]):
                frm=t.get('from') or {}; to=t.get('to') or {}
                f=str(frm.get('hash') if isinstance(frm,dict) else frm or '').lower()
                z=str(to.get('hash') if isinstance(to,dict) else to or '').lower()
                if f==addr.lower() and z: candidates.add(z)
              bridge={}
              for c in candidates:
                bridge[c]=get(BR+urllib.parse.quote(c,safe=''))
                bd=bridge[c].get('data') if isinstance(bridge[c],dict) else None
                if isinstance(bd,dict):
                  for bt in bd.get('transactions') or []:
                    for k,v in bt.items():
                      if isinstance(v,str) and v.lower().startswith('0x') and len(v)==42 and any(q in k.lower() for q in ['recipient','destination','receiver','beneficiary','to']): ds.add(v.lower())
              resolved.append({'activity':x,'tx_hash':h,'detail':detail,'transfers':transfers,'relay':relay,'candidate_recipients':sorted(candidates),'bridge_status':bridge})
            destsets[label]=ds
            out['wallets'][label]={'address':addr,'activity_rows':len(rows),'activity_errors':errs,'type_counts':types,'withdrawal_count':len(withdrawals),'withdrawals':resolved,'bridge_destination_addresses':sorted(ds)}
          labels=sorted(W)
          for i,a in enumerate(labels):
            for b in labels[i+1:]:
              common=sorted(destsets[a]&destsets[b])
              if common: out['shared'][f'{a}|{b}']=common
          Path('/tmp/pm-withdrawal-resolved.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps({'wallets':{k:{'activity_rows':v['activity_rows'],'type_counts':v['type_counts'],'withdrawal_count':v['withdrawal_count'],'bridge_destination_addresses':v['bridge_destination_addresses']} for k,v in out['wallets'].items()},'shared':out['shared']},indent=2))
          PY
      - name: Publish disposable result branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan tmp/pm-withdrawal-resolved-20260806
          git rm -rf .
          cp /tmp/pm-withdrawal-resolved.json .
          git add pm-withdrawal-resolved.json
          git commit -m 'Record temporary withdrawal resolution'
          git push --force origin HEAD:refs/heads/tmp/pm-withdrawal-resolved-20260806
